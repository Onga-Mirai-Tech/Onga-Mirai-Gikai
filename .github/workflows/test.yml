name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 依存ライブラリは入れない。パーサは標準ライブラリだけで動く。
      - name: パーサのテスト
        run: python -m unittest discover -s pipeline/tests -t . -v

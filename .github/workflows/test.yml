name: test

on:
  push:
    branches: [main]
  pull_request:

# 外部の人からの Pull Request でも動くので、書き込みの権限は持たせない。
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # 依存は PDF 解析の pypdf だけ。会議録の取得と解析は標準ライブラリで動く。
      - name: 依存をインストール
        run: pip install -r requirements.txt
      - name: パーサのテスト
        run: python -m unittest discover -s pipeline/tests -t . -v

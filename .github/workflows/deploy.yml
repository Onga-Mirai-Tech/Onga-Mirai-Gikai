name: deploy

# main に入った内容を本番へ反映する。
#
# 自動で本番公開しない方針（CLAUDE.md）に対して、ここが「人が確認した後」にあたる。
# summarize-collect.yml が作ったPRを人が見てマージしたときだけ動く。
# 手動実行も残しておく（デザインだけ直したときなど）。
#
# エックスサーバーの認証情報が入るまでは、ビルドまでで止まる。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `if:` の中では secrets を直接参照できない（書くとワークフロー全体が読み込めなくなる）。
    # ジョブの環境変数に「設定されているか」だけを渡し、ステップの条件はそれを見る。
    env:
      HAS_XSERVER: ${{ secrets.XSERVER_HOST != '' }}
    steps:
      - name: コードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: データを取得（private リポジトリ）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Onga-Mirai-Tech/Onga-Mirai-Gikai-data
          path: data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      - name: サイトをビルドする
        run: python -m pipeline.build.site

      - name: 本番へ反映する
        if: env.HAS_XSERVER == 'true'
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_PUBLIC_DIR: ${{ secrets.XSERVER_PUBLIC_DIR }}
          XSERVER_KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/stdin ~/xserver_key <<< "$XSERVER_SSH_KEY"
          # 接続先が本物のサーバーかを、登録しておいた指紋で確かめる。
          # accept-new（初めての相手は信用する）だと、毎回まっさらな実行環境では照合にならない。
          install -m 600 /dev/stdin ~/xserver_known_hosts <<< "$XSERVER_KNOWN_HOSTS"
          # .htaccess はサーバー側の設定（常時SSL化など）。ビルド結果で消さない。
          # .user.ini はエックスサーバーが置くPHPの設定。preview/ は確認用サイトで、
          # summarize-collect.yml が別に反映する。どちらも --delete で消さないよう除く。
          rsync -az --delete --exclude=.htaccess --exclude=.htpasswd \
            --exclude=.user.ini --exclude=/preview/ \
            -e "ssh -i ~/xserver_key -p 10022 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/xserver_known_hosts" \
            dist/ "$XSERVER_USER@$XSERVER_HOST:$XSERVER_PUBLIC_DIR/"
          rm -f ~/xserver_key ~/xserver_known_hosts

      - name: 認証情報がない場合の案内
        if: env.HAS_XSERVER != 'true'
        run: |
          echo "XSERVER_HOST が未設定のため、ビルドだけ行いました。"
          echo "設定手順は docs/運用メモ.md「2. 用意するもの」を参照してください。"

name: check-reach

# GitHub Actions の実行環境から、町のサーバーへ接続できるかだけを確かめる。
# 取得が「応答なし」で止まったときの切り分け用。手動で動かす。
#
# ページの中身は取りに行かない（TCP の接続だけ）。町のサーバーに負担をかけない。

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 実行環境の場所
        run: curl -s --max-time 10 https://ipinfo.io/country || echo "（不明）"

      - name: 町のサーバーへ接続できるか
        run: |
          ok=0
          for target in "iasb-sv.town.onga.lg.jp 80 会議録検索システム" \
                        "www.town.onga.lg.jp 443 町公式HP"; do
            set -- $target
            if timeout 15 bash -c "</dev/tcp/$1/$2" 2>/dev/null; then
              echo "つながる      $3（$1:$2）"
            else
              echo "つながらない  $3（$1:$2）"
              ok=1
            fi
          done
          exit $ok

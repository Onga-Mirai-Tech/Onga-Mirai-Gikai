name: monthly-update

# 月1回、会議録を取り込んで要約の生成まで進める。
#
# **要約の回収はこのワークフローでは行わない。** Batch API は完了まで
# 数分から十数時間かかり（実測: 議案152件で4分、一般質問48件で11時間）、
# GitHub Actions の1ジョブの上限6時間に収まる保証がない。
# 投入だけして `data/.update-in-flight` を置き、回収と公開の準備は
# summarize-collect.yml が引き継ぐ。
#
# 取得マナー（CLAUDE.md）:
#   - 日本時間の深夜帯に実行する
#   - 1リクエストごとに3秒あける。並列にしない
#   - 取得済みはスキップする
# 実行時間の目安: 初回の一括は約500リクエスト × 3秒 ＝ 25分前後。
# 2回目以降は数件なので1分もかからない。
#
# 取得した原文は private の Onga-Mirai-Gikai-data に入れる。
# このリポジトリには state.json（何をどこから取ったかの記録）だけをPRで戻す。

on:
  schedule:
    # 毎月2日 02:00 JST（= 前日 17:00 UTC）
    - cron: "0 17 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "取得件数の上限（動作確認用。空なら全件）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: データを取得（private リポジトリ）
        uses: actions/checkout@v4
        with:
          repository: Onga-Mirai-Tech/Onga-Mirai-Gikai-data
          path: data
          # 設定手順は docs/運用メモ.md を参照
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      - name: 会議録を取得
        run: |
          python -m pipeline.fetch.voices --allow-daytime \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # limit を指定した実行は動作確認なので、町の公式サイト側は触らない。
      - name: 通告書・審議案件結果を取得
        if: ${{ !inputs.limit }}
        run: python -m pipeline.fetch.town --refresh-index

      - name: 整形（発言者・議案・一般質問）
        if: ${{ !inputs.limit }}
        run: |
          python -m pipeline.parse.speakers
          python -m pipeline.parse.bills
          python -m pipeline.parse.threads

      - name: 通告書を読む
        if: ${{ !inputs.limit }}
        run: python -m pipeline.parse.tsukokusho || true

      - name: 要約を投入する（回収はしない）
        if: ${{ !inputs.limit }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          remaining=$(python -m pipeline.summarize.run --count)
          echo "未生成の要約: ${remaining}件"
          if [ "$remaining" = "0" ]; then
            echo "投入するものはありません。"
            exit 0
          fi
          python -m pipeline.summarize.run --no-wait
          # 回収待ちであることを summarize-collect.yml に伝える
          date -u +%Y-%m-%dT%H:%M:%SZ > data/.update-in-flight

      - name: データをdataリポジトリへ push
        working-directory: data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "新しいデータはありません。"
            exit 0
          fi
          git config user.name "onga-mirai-gikai-bot"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "月次取得と要約の投入 $(date -u +%Y-%m-%d)"
          git push

      # state.json は「何をどこから取ったか」の記録で、人が直す余地はない。
      # PRを挟まず main に直接入れる。取得件数は上のログで確認できる。
      # サイトの公開物は「自動で本番公開しない」方針なので、P5のデプロイでは別途PRを作る。
      - name: state.json の更新を push
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json に変更はありません。"
            exit 0
          fi
          git config user.name "onga-mirai-gikai-bot"
          git config user.email "noreply@github.com"
          git add state.json
          git commit -m "月次取得の記録を更新 $(date -u +%Y-%m-%d)"
          git push
